<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - UrbanMove</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo">
                <h1>Urban<span>Move</span></h1>
            </div>
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-hamburguer">☰</label>
            <nav id="menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="planos.html">Planos</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="pagina-interna">
        <h2 class="titulo-secao">Entre em Contato</h2>
        <p class="subtitulo">Preencha o formulário e nossa equipe retornará em breve.</p>

        <div class="formulario-container">
            <form>

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo">
                    <label for="atendimento">Tipo de atendimento</label>
                    <select id="atendimento" name="atendimento" required>
                        <option value="">Selecione uma opção</option>
                        <option value="suporte">Suporte técnico</option>
                        <option value="comercial">Comercial</option>
                        <option value="financeiro">Financeiro</option>
                        <option value="reclamacao">Reclamação</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit" class="btn">Enviar mensagem</button>

            </form>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <div class="footer-container">
            <p>&copy; 2025 UrbanMove. Todos os direitos reservados.</p>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="planos.html">Planos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </div>
    </footer>


</body>
</html>
