<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MedAgenda - Contato</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <a href="index.html" class="logo">Med<span>Agenda</span></a>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="especialidades.html">Especialidades</a></li>
                    <li><a href="planos.html">Planos</a></li>
                    <li><a href="contato.html" class="ativo">Contato</a></li>
                </ul>
            </nav>
        </header>
        <div class="pagina-titulo">
            <h1>Entre em Contato</h1>
            <p>Preencha o formulário e retornaremos em breve.</p>
        </div>
        <div class="form-container">
            <h2>Formulário de Contato</h2>
            <form>
                <div class="grupo-campo">
                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="grupo-campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>
                <div class="grupo-campo">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>
                <div class="grupo-campo">
                    <label for="cidade">Cidade *</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>
                </div>
                <div class="grupo-campo">
                    <label for="atendimento">Tipo de atendimento</label>
                    <select id="atendimento" name="atendimento">
                        <option value="">Selecione uma opção</option>
                        <option value="demonstracao">Solicitar demonstração</option>
                        <option value="suporte">Suporte técnico</option>
                        <option value="planos">Informações sobre planos</option>
                        <option value="parceria">Proposta de parceria</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
                <div class="grupo-campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>
                <div class="grupo-checkbox">
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Li e aceito os termos de uso e política de privacidade.</label>
                </div>
                <button type="submit" class="btn-enviar">Enviar mensagem</button>
            </form>
        </div>
        <footer>
            <p>&copy; 2025 MedAgenda. Todos os direitos reservados.</p>
        </footer>
    </body>
</html>
